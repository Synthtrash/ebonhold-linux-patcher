name: Create Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev pkg-config

      - run: go test ./...
      - run: go vet ./...

      - name: Build release archive
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/ebonhold-launcher-linux-amd64 ./cmd/ebonhold-launcher
          tar -C dist -czf dist/ebonhold-launcher-linux-amd64.tar.gz ebonhold-launcher-linux-amd64
          (cd dist && sha256sum ebonhold-launcher-linux-amd64.tar.gz > ebonhold-launcher-linux-amd64.tar.gz.sha256)

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        id: semantic
        env:
          GITHUB_TOKEN: ${{ github.token }}
